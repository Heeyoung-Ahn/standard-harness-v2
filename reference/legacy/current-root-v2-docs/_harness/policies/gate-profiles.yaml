        "closeout"
      ]
    },
    "product-feature": {
      "version": "product-feature@1",
      "requiredGates": [
        "test-plan",
        "implementation",
        "evidence-trust",
        "test",
        "e2e-applicability",
        "requirements",
        "security",
        "ai-review",
        "refactor",
        "closeout"
      ]
    },
    "product-bugfix": {
      "version": "product-bugfix@1",
      "requiredGates": [
        "test-plan",
        "regression",
        "evidence-trust",
        "requirements",
        "security-if-triggered",
        "refactor",
        "closeout"
      ]
    },
    "product-refactor": {
      "version": "product-refactor@1",
      "requiredGates": [
        "test-plan",
        "regression",
        "contract-if-applicable",
        "refactor",
        "ai-review",
        "closeout"
      ]
    },
    "security-data": {
